apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-reader
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: catalog-reader }
  template:
    metadata:
      labels: { app: catalog-reader }
    spec:
      containers:
        - name: catalog-reader
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: catalog-reader-env }
          resources: {{ toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
