image:
  repository: multimodal-recsys/catalog-reader-api
  tag: latest
replicaCount: 3
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "1", memory: 512Mi }
env:
  ENV: "production"
  DATABASE_URL: ""
  SEARCH_RANKING_URL: "http://search-ranking"
  DEMO_TENANT_API_KEY: ""
